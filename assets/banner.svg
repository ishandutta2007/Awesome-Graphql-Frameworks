<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#16122b"/>
      <stop offset="100%" stop-color="#0b0814"/>
    </linearGradient>

    <!-- GraphQL Pink/Magenta Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e10098"/>
      <stop offset="100%" stop-color="#ff4fb7"/>
    </linearGradient>

    <!-- Subtitle Glow / Cyan-Purple Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Glow Filter for Nodes -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.35; }
      50% { transform: scale(1.15) translateY(-8px); opacity: 0.65; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(8px); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-glow-1 {
      transform-origin: 150px 180px;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .pulse-glow-2 {
      transform-origin: 1050px 180px;
      animation: pulseOrb 7s ease-in-out infinite reverse;
    }
    .rotating-hex {
      transform-origin: 150px 180px;
      animation: rotateRing 28s linear infinite;
    }
    .rotating-nodes {
      transform-origin: 1050px 180px;
      animation: rotateRing 32s linear infinite reverse;
    }
    .floating-card-1 {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatParticle 6s ease-in-out infinite 1.5s;
    }
    .graph-edge {
      stroke-dasharray: 6 4;
      animation: dashLine 3s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(225, 0, 152, 0.25)" stroke-width="2"/>

  <!-- Subtle Matrix / Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- BACKGROUND DYNAMIC ELEMENTS (Far sides & background, non-interfering) -->
  <!-- Left Side: Glowing Nebula + Rotating GraphQL Hexagon System -->
  <g class="pulse-glow-1">
    <circle cx="150" cy="180" r="100" fill="#e10098" opacity="0.25" filter="url(#glow)"/>
  </g>
  <g class="rotating-hex">
    <!-- Outer Hexagram Points & Connected Lines -->
    <polygon points="150,110 210,145 210,215 150,250 90,215 90,145" fill="none" stroke="#e10098" stroke-width="1.8" opacity="0.4"/>
    <polygon points="150,110 90,215 210,215" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.3"/>
    <polygon points="150,250 90,145 210,145" fill="none" stroke="#9d4edd" stroke-width="1.2" opacity="0.3"/>
    <circle cx="150" cy="110" r="5" fill="#e10098"/>
    <circle cx="210" cy="145" r="5" fill="#00f0ff"/>
    <circle cx="210" cy="215" r="5" fill="#e10098"/>
    <circle cx="150" cy="250" r="5" fill="#9d4edd"/>
    <circle cx="90" cy="215" r="5" fill="#00f0ff"/>
    <circle cx="90" cy="145" r="5" fill="#e10098"/>
  </g>
  <circle cx="150" cy="180" r="16" fill="#e10098" opacity="0.8" filter="url(#glow)"/>
  <circle cx="150" cy="180" r="6" fill="#ffffff"/>

  <!-- Right Side: Glowing Nebula + Rotating Multi-Node Federation Cluster -->
  <g class="pulse-glow-2">
    <circle cx="1050" cy="180" r="110" fill="#9d4edd" opacity="0.28" filter="url(#glow)"/>
  </g>
  <g class="rotating-nodes">
    <circle cx="1050" cy="180" r="75" fill="none" stroke="#e10098" stroke-dasharray="8 6" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1050" cy="105" r="7" fill="#00f0ff"/>
    <circle cx="1125" cy="180" r="7" fill="#e10098"/>
    <circle cx="1050" cy="255" r="7" fill="#9d4edd"/>
    <circle cx="975" cy="180" r="7" fill="#ff4fb7"/>
    <line x1="1050" y1="180" x2="1050" y2="105" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <line x1="1050" y1="180" x2="1125" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <line x1="1050" y1="180" x2="1050" y2="255" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <line x1="1050" y1="180" x2="975" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  </g>
  <circle cx="1050" cy="180" r="18" fill="#7928ca" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1050" cy="180" r="7" fill="#00f0ff"/>

  <!-- Animated Dynamic Data Flows (Left-to-Right Subtle Curved Streams) -->
  <path d="M 190,140 Q 600,60 1010,140" fill="none" stroke="#e10098" stroke-width="1.5" opacity="0.25" class="graph-edge"/>
  <path d="M 190,220 Q 600,300 1010,220" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.25" class="graph-edge"/>

  <!-- Floating Dynamic Tech Micro-Badges on Sides -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="65" y="45" width="130" height="28" rx="14" fill="rgba(225, 0, 152, 0.18)" stroke="rgba(225, 0, 152, 0.4)" stroke-width="1"/>
    <circle cx="80" cy="59" r="4" fill="#e10098"/>
    <text x="92" y="63" class="pill-text" font-size="11">Federation 2.0</text>
  </g>
  <g class="floating-card-2" opacity="0.85">
    <rect x="1005" y="285" width="130" height="28" rx="14" fill="rgba(0, 240, 255, 0.15)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <circle cx="1020" cy="299" r="4" fill="#00f0ff"/>
    <text x="1032" y="303" class="pill-text" font-size="11">Schema-First</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Core Pills (Strictly in foreground, crystal clear) -->
  <g>
    <!-- Top Micro Tagline -->
    <rect x="495" y="45" width="210" height="26" rx="13" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text x="600" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#ff4fb7" letter-spacing="1.5">CURATED ECOSYSTEM</text>

    <!-- Main Title with Distinct Brand Gradient -->
    <text x="600" y="125" text-anchor="middle" class="main-title">
      Awesome <tspan fill="url(#primaryGrad)">GraphQL</tspan> Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" text-anchor="middle" class="sub-title" fill="#e2e8f0">
      The Modern Landscape of GraphQL Servers, Federation Gateways &amp; Cloud Platforms
    </text>

    <!-- Category Pills / Feature Tags -->
    <g transform="translate(260, 205)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="150" height="34" rx="17" fill="rgba(225, 0, 152, 0.2)" stroke="#e10098" stroke-width="1.2"/>
        <text x="75" y="22" text-anchor="middle" class="pill-text">⚡ High-Perf Gateways</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(157, 78, 221, 0.2)" stroke="#9d4edd" stroke-width="1.2"/>
        <text x="82.5" y="22" text-anchor="middle" class="pill-text">🌐 Unified Federation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(345, 0)">
        <rect x="0" y="0" width="155" height="34" rx="17" fill="rgba(0, 240, 255, 0.18)" stroke="#00f0ff" stroke-width="1.2"/>
        <text x="77.5" y="22" text-anchor="middle" class="pill-text">🛡️ Schema Registry</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(515, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2"/>
        <text x="82.5" y="22" text-anchor="middle" class="pill-text">📦 Code &amp; Schema First</text>
      </g>
    </g>

    <!-- Bottom Metric / Badge Footer -->
    <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8">
      🔥 Covering Apollo Server &bull; Supabase pg_graphql &bull; Prisma &bull; Hasura &bull; GraphQL Hive &bull; Cosmo &bull; NestJS &bull; Yoga
    </text>
  </g>
</svg>
